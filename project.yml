name: DayCount
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.daycount
    APP_STORE_ID: "6837217147"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DayCount:
    type: application
    platform: iOS
    sources: [DayCount, Shared]
    dependencies:
      - target: DayCountWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"  # XcodeGen target 默认 1,2 会盖掉项目级，必须写在 target 上（11-20 饮水因此被要 iPad 截图）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: DayCount AppStore
    entitlements:
      path: DayCount/DayCount.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.daycount]
    info:
      path: DayCount/Info.plist
      properties:
        CFBundleDisplayName: 倒数日
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        DayCountProProductID: $(APP_ID).pro
        DayCountTrialProductID: $(APP_ID).trial
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.daycount.event
            CFBundleURLSchemes: [daycount]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Date Card
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.daycount.datecard]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.daycount.datecard
            UTTypeDescription: Date Card
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [datecard]
  DayCountWidget:
    type: app-extension
    platform: iOS
    sources:
      - DayCountWidget
      - path: Shared
        excludes: [Entitlement.swift, Launch.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgsldswk.daycount.widget
        TARGETED_DEVICE_FAMILY: "1"  # XcodeGen target 默认 1,2 会盖掉项目级，必须写在 target 上（11-20 饮水因此被要 iPad 截图）
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: DayCount Widget AppStore
    entitlements:
      path: DayCountWidget/DayCountWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.daycount]
    info:
      path: DayCountWidget/Info.plist
      properties:
        CFBundleDisplayName: 倒数日
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  DayCountTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DayCountTests]
    dependencies:
      - target: DayCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  DayCountUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DayCountUITests]
    dependencies:
      - target: DayCount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DayCount
schemes:
  DayCount:
    build:
      targets:
        DayCount: all
        DayCountTests: [test]
    test:
      config: Debug
      targets: [DayCountTests]
  DayCountUI:
    build:
      targets:
        DayCount: all
        DayCountUITests: [test]
    test:
      config: Debug
      targets: [DayCountUITests]
